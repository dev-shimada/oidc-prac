# Override file that adds the local Go OIDC provider as a Docker service
# and routes the conformance suite server to it.
#
# Hostname strategy:
#   localhost.emobix.co.uk resolves to 127.0.0.1 via public DNS (same domain the
#   conformance suite uses for its own base URL). The OIDC provider runs on port 49151.
#
#   - Browser:           localhost.emobix.co.uk → public DNS → 127.0.0.1 → published port 49151
#   - server container:  localhost.emobix.co.uk → extra_hosts host-gateway → published port 49151
#
# No /etc/hosts modification needed.
#
# Usage (from project root):
#   docker compose -f conformance-suite/docker-compose-dev-mac.yml -f conformance-suite-local-provider.yml up
#
# Test plan configuration in the conformance suite UI (https://localhost.emobix.co.uk:8443):
#   Discovery URL: http://localhost.emobix.co.uk:49151/.well-known/openid-configuration
#   Client ID:     1234
#   Client Secret: secret
services:
  authorization:
    build:
      context: ../authorization
    ports:
      - "49151:49151"
    volumes:
      - ../authorization:/app
    environment:
      - ISSUER_BASE_URL=http://localhost.emobix.co.uk:49151

  server:
    extra_hosts:
      - "localhost.emobix.co.uk:host-gateway"
    depends_on:
      - authorization
